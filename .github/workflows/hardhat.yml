name: B-SAFE Hardhat integration

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read
  security-events: write

jobs:
  unit-service:
    name: Unit and service tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check and unit/service tests
        run: pnpm check && pnpm exec vitest run --exclude 'server/database.integration.test.ts'

      - name: Enforce coverage thresholds
        run: pnpm exec vitest run --coverage --exclude 'server/database.integration.test.ts'

  database-integration:
    name: MySQL persistence tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: bsafe_test
          MYSQL_USER: bsafe
          MYSQL_PASSWORD: bsafe_test_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ubsafe -pbsafe_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://bsafe:bsafe_test_password@127.0.0.1:3306/bsafe_test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Drizzle migrations
        run: pnpm drizzle-kit migrate

      - name: Run database integration tests
        run: pnpm exec vitest run server/database.integration.test.ts

  browser:
    name: Browser control-plane tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Start B-SAFE portal
        run: pnpm dev > portal.log 2>&1 &

      - name: Wait for portal health
        run: |
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat portal.log
          exit 1

      - name: Run browser interaction tests
        run: pnpm test:browser

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bsafe-browser-evidence
          path: portal.log
          if-no-files-found: warn
          retention-days: 30

  live-hardhat:
    name: Live Hardhat integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile Solidity fixtures
        run: pnpm exec hardhat compile

      - name: Start Hardhat JSON-RPC network
        run: pnpm evm:node > hardhat.log 2>&1 &

      - name: Wait for JSON-RPC health
        run: |
          for attempt in {1..30}; do
            if curl --silent --fail -X POST http://127.0.0.1:8545 \
              -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' | grep -q '0x7a69'; then
              exit 0
            fi
            sleep 1
          done
          cat hardhat.log
          exit 1

      - name: Run live Hardhat integration scenarios
        run: pnpm test:evm:ci

      - name: Generate retained evidence reports
        run: pnpm evidence:generate

      - name: Publish SARIF annotations to GitHub code scanning
        if: always() && hashFiles('reports/bsafe.sarif') != '' && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/bsafe.sarif
          category: bsafe-hardhat

      - name: Upload Hardhat and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bsafe-hardhat-evidence
          path: |
            hardhat.log
            artifacts/
            reports/
          if-no-files-found: warn
          retention-days: 30

  nightly-ingestion:
    name: Scheduled dashboard ingestion
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: bsafe_test
          MYSQL_USER: bsafe
          MYSQL_PASSWORD: bsafe_test_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ubsafe -pbsafe_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://bsafe:bsafe_test_password@127.0.0.1:3306/bsafe_test
      BUILT_IN_FORGE_API_URL: ${{ secrets.BUILT_IN_FORGE_API_URL }}
      BUILT_IN_FORGE_API_KEY: ${{ secrets.BUILT_IN_FORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect optional Forge integration
        id: forge
        env:
          BUILT_IN_FORGE_API_URL: ${{ secrets.BUILT_IN_FORGE_API_URL }}
          BUILT_IN_FORGE_API_KEY: ${{ secrets.BUILT_IN_FORGE_API_KEY }}
        run: |
          if [ -n "${BUILT_IN_FORGE_API_URL:-}" ] && [ "${BUILT_IN_FORGE_API_URL}" != "***" ] && [ -n "${BUILT_IN_FORGE_API_KEY:-}" ] && [ "${BUILT_IN_FORGE_API_KEY}" != "***" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Forge integration is configured; scheduled publication will run."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Forge integration is not configured; scheduled publication will be skipped."
          fi

      - name: Apply Drizzle migrations
        run: pnpm drizzle-kit migrate

      - name: Generate nightly evidence
        run: pnpm evidence:generate

      - name: Ingest nightly evidence through Forge
        if: steps.forge.outputs.configured == 'true'
        run: pnpm evidence:ingest

      - name: Report skipped Forge publication
        if: steps.forge.outputs.configured != 'true'
        run: echo "::notice::Forge URL/key secrets are not configured; deterministic CI and database checks passed, but external evidence publication was skipped."
