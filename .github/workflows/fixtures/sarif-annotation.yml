name: bsafe-sarif-annotation-fixture

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  annotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload B-SAFE SARIF annotations
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/bsafe.sarif
          category: bsafe-hardhat
